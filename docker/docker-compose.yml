# Deploy the server from the published image, with the database kept in a named
# volume so it survives restarts and upgrades.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# The image tag defaults to "latest"; pin a release with DIGGAME_TAG:
#
#   DIGGAME_TAG=v0.7.0-pre1 docker compose -f docker/docker-compose.yml up -d
#
# ghcr packages are private by default - either make the package public or run
# `docker login ghcr.io` first. To build from this checkout instead, use
# docker-compose.build.yml.
#
# Any of the variables below can be set in a .env file next to this file; the
# empty defaults mean "feature off", exactly as for a local run.
services:
  diggame:
    image: ghcr.io/thales-om/diggame:${DIGGAME_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DIGGAME_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: /app/data/diggame.db
      WORLD_SEED: ${WORLD_SEED:-}
      RESET_SECRET: ${RESET_SECRET:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_VIEW_MARGIN: ${ADMIN_VIEW_MARGIN:-30}
    volumes:
      - diggame-data:/app/data

volumes:
  diggame-data:
